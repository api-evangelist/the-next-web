        type: RSS
    description: >-
      The Next Web provides an RSS feed that delivers the latest technology news,
      analysis, and articles published on thenextweb.com. The feed covers a broad
      range of topics including artificial intelligence, startups, innovation, digital
      culture, and the future of work. Category-specific feeds are also available
      for topics such as Deep Tech, Plugged (consumer technology), and Sustainability.
